<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techslayer - Run Smarter</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1a202c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .card {
            background-color: #2d3748;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #2b6cb0;
        }
    </style>
</head>
<body>
    <h1>Welcome to Techslayer</h1>
    <div class="card">
        <p>Track your runs, set goals, and improve your performance with Techslayer.</p>
        <button class="button" onclick="handleGoogleLogin()">Sign in with Google</button>
    </div>

    <script>
        function handleGoogleLogin() {
            window.location.href = "https://accounts.google.com/o/oauth2/v2/auth"; // Replace with actual Google OAuth URL
        }
    </script>
</body>
</html>
